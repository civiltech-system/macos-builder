name: CI
on:
  push:
    branches:
    - main
  pull_request:
  workflow_dispatch:
    inputs:
      type:
        type: choice
        default: draft
        options:
        - build
        - draft
        - release

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  read-repo-files:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Setup Outputs
      id: out
      run: |
        echo "mcpelauncher-ref=$(cat mcpelauncher.commit)" >> $GITHUB_OUTPUT
    outputs:
      mcpelauncher-ref: ${{ steps.out.outputs.mcpelauncher-ref }}
  ci:
    needs: read-repo-files
    # The fork uses build-26.50.yml. Keep the upstream release workflow from
    # publishing or starting a duplicate build after every push to the fork.
    if: ${{ !cancelled() && github.repository == 'minecraft-linux/macos-builder' }}
    uses: ./.github/workflows/main.yml
    permissions:
      contents: read
      actions: read
      id-token: write
    with:
      publish: ${{ github.event_name == 'push' && github.server_url == 'https://github.com' || github.event_name == 'workflow_dispatch' && inputs.type == 'release' }}
      use-repo-files: true
      offset: 400
      build-m1: true
      draft: ${{ github.event_name == 'workflow_dispatch' && inputs.type == 'draft' }}
      mcpelauncher-ref: ${{ needs.read-repo-files.outputs.mcpelauncher-ref || 'ng' }}
    secrets: inherit
